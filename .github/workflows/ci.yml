name: CI

permissions:
  contents: read

env:
  COINW_INTEGRATION: '0'
  COINW_TEST_MUTATIONS: '0'

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: fmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "unformatted: $unformatted"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -timeout 2m ./...

      - name: Integration gates stay off
        run: go test -run '^TestIntegration' -v .

      - name: build
        run: go build ./...

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: GolangCI-Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

      - name: Verify module checksums
        run: go mod verify

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Check dependency manifest is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
